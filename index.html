<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>Ferco Farma · Operación</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="brand">Ferco<span>Farma</span></div>
      <p class="muted">Sistema unificado de operación</p>
      <form id="login-form">
        <label>Correo</label>
        <input id="login-email" type="email" autocomplete="username" required placeholder="usuario@empresa.com">
        <label>Contraseña</label>
        <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <button class="btn primary" type="submit">Ingresar</button>
        <button class="link-btn" id="forgot-password" type="button">Restablecer contraseña</button>
        <div id="login-error" class="error hidden"></div>
      </form>
    </div>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn">☰</button>
      <div class="brand small">Ferco<span>Farma</span></div>
      <div class="userbox"><span id="user-name">Usuario</span><small id="user-role"></small><button id="logout" class="link-btn">Salir</button></div>
    </header>

    <aside id="sidebar" class="sidebar">
      <nav id="nav"></nav>
    </aside>

    <main id="main" class="main"></main>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
